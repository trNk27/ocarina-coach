<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b56c8">
<title>Ocarina Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: 3D instrument stage on the left (sticky on wide screens), working panel with four tabs on the right; stacks on phones. */
:root{
  --bg:#eef1f7; --surface:#ffffff; --surface-2:#f4f6fb; --ink:#141a2c; --muted:#59637f; --line:#d7ddeb;
  --accent:#2b56c8; --accent-ink:#ffffff; --accent-soft:#e3eafb;
  --pad:#d49c2f; --ok:#22805a; --warn:#a9640f; --warn-soft:#fbeedc;
  --body:#2f54c0; --mouth:#4a6cd2; --hole:#0a0e18; --rim:#c9d4f2;
  --stage-a:#fbfcff; --stage-b:#d8e0f1;
  --abtn:#2b56c8; --cbtn:#e2b236; --cbtn-ink:#3b2a00;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1120; --surface:#141b2e; --surface-2:#1a2238; --ink:#e6ebf7; --muted:#98a4c3; --line:#273250;
    --accent:#86a2ff; --accent-ink:#0c1120; --accent-soft:#1f2b4d;
    --pad:#e8b850; --ok:#5cc792; --warn:#f0a94b; --warn-soft:#3a2a14;
    --body:#3557c4; --mouth:#5576dc; --hole:#03050b; --rim:#9fb2ea;
    --stage-a:#1c2644; --stage-b:#0c1120;
    --abtn:#5b7ff0; --cbtn:#e8b850; --cbtn-ink:#2a1d00;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1120; --surface:#141b2e; --surface-2:#1a2238; --ink:#e6ebf7; --muted:#98a4c3; --line:#273250;
  --accent:#86a2ff; --accent-ink:#0c1120; --accent-soft:#1f2b4d;
  --pad:#e8b850; --ok:#5cc792; --warn:#f0a94b; --warn-soft:#3a2a14;
  --body:#3557c4; --mouth:#5576dc; --hole:#03050b; --rim:#9fb2ea;
  --stage-a:#1c2644; --stage-b:#0c1120;
  --abtn:#5b7ff0; --cbtn:#e8b850; --cbtn-ink:#2a1d00;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.6rem,4vw,2.2rem);letter-spacing:-.02em;margin:0;line-height:1.05}
h1 small{display:block;font-family:var(--f-body);font-weight:500;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.sync{font-size:.8rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync[data-s="synced"] i{background:var(--ok)}
.sync[data-s="saving"] i{background:var(--pad)}
.layout{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.layout{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}.stage-col{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}}
.stage{position:relative;width:100%;aspect-ratio:4/3;max-height:60vh;border-radius:20px;overflow:hidden;background:radial-gradient(120% 90% at 50% 20%,var(--stage-a),var(--stage-b));border:1px solid var(--line)}
@media (max-width:899px){.stage{aspect-ratio:auto;height:min(46vh,380px)}}
#gl{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.hl{position:absolute;left:0;top:0;font:600 10.5px/1 var(--f-mono);padding:3px 5px;border-radius:5px;background:color-mix(in srgb,var(--surface) 88%,transparent);color:var(--ink);border:1px solid var(--line);white-space:nowrap;will-change:transform}
.hl.closed{background:var(--pad);color:#1d1400;border-color:transparent}
.hl.sel{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.stage-tools{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:.8rem;font-weight:500;cursor:pointer}
.chipbtn:hover{border-color:var(--accent)}
.chipbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.legend{position:absolute;right:10px;top:10px;display:flex;gap:10px;font-size:.75rem;color:var(--muted);background:color-mix(in srgb,var(--surface) 80%,transparent);padding:4px 9px;border-radius:999px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block}
.sw.c{background:var(--pad)} .sw.o{background:var(--hole);box-shadow:0 0 0 2px var(--rim)}
.banner{position:absolute;left:10px;right:10px;top:10px;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:8px 12px;font-size:.85rem;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner button{background:transparent;border:1px solid currentColor;border-radius:999px;padding:3px 10px;cursor:pointer;color:inherit}
.fallback{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;color:var(--muted)}
.caption{margin-top:10px;font-size:.9rem;color:var(--muted);min-height:1.5em}
.caption b{color:var(--ink);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;min-width:0}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface-2);padding:4px;border-radius:12px;margin-bottom:16px}
.tabs button{border:0;background:transparent;border-radius:9px;padding:8px 4px;font-weight:600;font-size:.88rem;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(10,20,50,.12)}
.lede{margin:0 0 14px;color:var(--muted);font-size:.92rem;max-width:62ch}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h2{font-family:var(--f-display);font-weight:700;font-size:1.25rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;font-weight:600}
.progress{display:flex;align-items:center;gap:10px;font-size:.82rem;color:var(--muted);margin-bottom:14px}
.bar{flex:1;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.stepnav{display:flex;align-items:center;gap:10px}
.icon{width:40px;height:40px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:1.3rem;cursor:pointer;display:grid;place-items:center}
.icon:disabled{opacity:.35;cursor:default}
.stepinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.stepdesc{font-size:.9rem;overflow-wrap:anywhere}
.reading{display:flex;align-items:center;gap:14px;margin:16px 0 6px;padding:14px 16px;border-radius:14px;background:var(--surface-2)}
.bignote{font-family:var(--f-mono);font-weight:600;font-size:2.4rem;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.reading .meta{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.pill{font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:99px;letter-spacing:.02em}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.exp{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.cents{font-family:var(--f-mono);font-size:.82rem;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:8px 14px;font-weight:600;font-size:.88rem;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding-inline:8px}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.4;cursor:default}
.notegrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.notegrid button{font-family:var(--f-mono);font-weight:600;padding:9px 0;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.notegrid button.sharp{background:var(--surface-2)}
.notegrid button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.octave{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.85rem;color:var(--muted)}
.octave b{font-family:var(--f-mono);color:var(--ink);min-width:1.5ch;text-align:center}
.octave button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.matcher{border:1px dashed var(--line);border-radius:14px;padding:12px 14px}
.matcher input[type=range]{width:100%;accent-color:var(--accent);margin:10px 0 4px;height:28px}
.ticks{position:relative;height:16px;font:500 10px var(--f-mono);color:var(--muted)}
.ticks span{position:absolute;transform:translateX(-50%)}
.mread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.mread .val{font-family:var(--f-mono);font-weight:600;font-size:1.1rem}
.hint{font-size:.82rem;color:var(--muted);margin:8px 0 0}
.chart{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--accent)}
.card[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.card .top{display:flex;justify-content:space-between;align-items:baseline}
.card .n{font-family:var(--f-mono);font-weight:600;font-size:1.25rem}
.card svg{width:100%;height:auto;display:block}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.ok{background:var(--ok)} .dot.exp{background:var(--accent);opacity:.5}
.empty{padding:22px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center}
.keyrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:var(--surface-2);margin-bottom:6px}
.keyrow .lbl{font-size:.85rem;font-weight:600;margin-right:auto}
.keyrow .v{font-family:var(--f-mono);font-weight:600;min-width:6ch;text-align:center}
.keyrow button{min-width:36px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-family:var(--f-mono);font-size:.8rem}
.songlist{display:flex;flex-direction:column;gap:6px}
.songrow{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left}
.songrow:hover{border-color:var(--accent)}
.songrow .nm{font-weight:600;flex:1;min-width:0}
.songrow .st{font-size:.8rem;color:var(--muted);white-space:nowrap}
.songrow.locked .nm{color:var(--muted)}
.lock{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--muted);font-size:.85rem}
.songrow.open .lock{background:var(--accent-soft);color:var(--accent)}
.g{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font:700 11px/1 var(--f-body);flex:none}
.g.a{background:var(--abtn);color:#fff}
.g.c{background:var(--cbtn);color:var(--cbtn-ink);font-size:10px}
.staffbox{overflow-x:auto;border-radius:14px;background:var(--surface-2);padding:6px 4px;margin:12px 0}
.staffbox svg{display:block}
.now{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;border:1px solid var(--line)}
.now .bignote{font-size:2rem}
.now .sub{font-size:.85rem;color:var(--muted)}
.player{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.player select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 8px;font:inherit;font-size:.85rem;color:var(--ink)}
.map{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.map span{display:inline-flex;align-items:center;gap:6px;padding:4px 9px 4px 4px;border-radius:99px;background:var(--surface-2);font:500 .8rem var(--f-mono)}
.map span.miss{background:var(--warn-soft);color:var(--warn)}
.pad{display:flex;gap:22px;align-items:center;justify-content:center;padding:14px;border-radius:16px;background:var(--surface-2);margin:12px 0}
.cgrid{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px)}
.padbtn{width:48px;height:48px;border-radius:50%;border:0;cursor:pointer;font-weight:700;font-size:1rem;display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.padbtn:active{transform:translateY(1px);box-shadow:none}
.padbtn.c{background:var(--cbtn);color:var(--cbtn-ink)}
.padbtn.a{background:var(--abtn);color:#fff;width:58px;height:58px;font-size:1.2rem}
.seq{display:flex;flex-wrap:wrap;gap:5px;min-height:34px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:12px}
.seq .ph{color:var(--muted);font-size:.85rem}
.seq .nchip{font:600 .8rem var(--f-mono);padding:3px 8px;border-radius:8px;background:var(--surface-2)}
input[type=text]{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 11px;font:inherit}
.holes{display:flex;flex-direction:column;gap:6px}
.holerow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;flex-wrap:wrap;cursor:pointer;background:var(--surface)}
.holerow[aria-selected="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.holerow .tag{font:600 .8rem var(--f-mono);background:var(--surface-2);padding:3px 7px;border-radius:7px;min-width:5ch;text-align:center}
.holerow .fn{flex:1;min-width:8ch;font-size:.9rem}
.holerow .fn small{display:block;color:var(--muted);font-size:.75rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 9px;font-size:.78rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.confirmbox{border:1px solid var(--warn);background:var(--warn-soft);border-radius:12px;padding:10px 12px;font-size:.88rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.confirmbox span{flex:1;min-width:16ch}
.mic{border-radius:14px;padding:12px 14px;background:var(--accent-soft);margin:10px 0 12px;display:flex;flex-direction:column;gap:8px}
.needle{position:relative;height:8px;border-radius:99px;background:color-mix(in srgb,var(--surface) 70%,transparent)}
.needle::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--muted);transform:translateX(-50%)}
.needle i{position:absolute;top:-3px;width:6px;height:14px;border-radius:3px;background:var(--accent);transform:translateX(-50%);left:50%;transition:left .08s linear}
.auto{display:flex;gap:8px;align-items:flex-start;font-size:.85rem;cursor:pointer}
.auto input{margin-top:3px;accent-color:var(--accent)}
.divider{height:1px;background:var(--line);margin:18px 0}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Ocarina Coach<small>Calibrate your print · learn the fingerings</small></h1>
    <span class="sync" id="sync" data-s="local"><i></i><span>Saved in this browser</span></span>
  </header>
  <div class="layout">
    <div class="stage-col">
      <div class="stage" id="stage">
        <canvas id="gl" aria-label="3D ocarina. Drag to turn it, tap a hole to select it."></canvas>
        <div class="labels" id="labels"></div>
        <div class="legend"><span><i class="sw c"></i>cover</span><span><i class="sw o"></i>open</span></div>
        <div class="banner" id="banner" hidden><span id="bannerText"></span><button id="bannerCancel" type="button">Cancel</button></div>
        <div class="stage-tools">
          <button class="chipbtn" type="button" id="vTop" aria-pressed="true">Top</button>
          <button class="chipbtn" type="button" id="vBack" aria-pressed="false">Underside</button>
          <button class="chipbtn" type="button" id="vReset">Reset view</button>
        </div>
        <div class="fallback" id="fallback" hidden>The 3D view couldn't start in this browser. The chart diagrams still show every fingering.</div>
      </div>
      <p class="caption" id="caption"></p>
    </div>
    <section class="panel">
      <nav class="tabs" role="tablist">
        <button role="tab" id="t-calibrate" data-tab="calibrate">Calibrate</button>
        <button role="tab" id="t-chart" data-tab="chart">Chart</button>
        <button role="tab" id="t-songs" data-tab="songs">Songs</button>
        <button role="tab" id="t-holes" data-tab="holes">Holes</button>
      </nav>
      <div id="panel-calibrate" role="tabpanel"></div>
      <div id="panel-chart" role="tabpanel" hidden></div>
      <div id="panel-songs" role="tabpanel" hidden></div>
      <div id="panel-holes" role="tabpanel" hidden></div>
    </section>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  attrs = attrs || {};
  for (const k in attrs){
    const v = attrs[k];
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids){ if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(c)); }
  return e;
}
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- music helpers ---------- */
const NAMES = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const nn = m => m == null ? '—' : NAMES[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1);
const hz = (m, c) => 440 * Math.pow(2, (m + (c || 0) / 100 - 69) / 12);
const LETTER = [0,0,1,1,2,3,3,4,4,5,5,6], SHARP = [0,1,0,1,0,0,1,0,1,0,1,0];
const dia = m => (Math.floor(m / 12) - 1) * 7 + LETTER[((m % 12) + 12) % 12];

/* Game ocarina buttons and the pitch each one plays in the game */
const BTN = {
  A:{midi:62, glyph:'A', cls:'a', name:'A'},
  D:{midi:65, glyph:'▼', cls:'c', name:'C-down'},
  R:{midi:69, glyph:'▶', cls:'c', name:'C-right'},
  L:{midi:71, glyph:'◀', cls:'c', name:'C-left'},
  U:{midi:74, glyph:'▲', cls:'c', name:'C-up'}
};
const SONGS = [
  {id:'lullaby', name:"Zelda's Lullaby", group:'Songs'},
  {id:'epona', name:"Epona's Song", group:'Songs'},
  {id:'saria', name:"Saria's Song", group:'Songs'},
  {id:'sun', name:"Sun's Song", group:'Songs'},
  {id:'time', name:'Song of Time', group:'Songs'},
  {id:'storms', name:'Song of Storms', group:'Songs'},

function autoFit(){
  const base = [62,65,69,71,74];

  let best = 0, score = -1;
  for (let sh = -24; sh <= 24; sh++){
    const sc = base.filter(m => have.has(m + sh)).length;

  }

}

function songSeq(sg){ if (sg.custom) return (sg.notes || []).slice(); const r = state.songs[sg.id]; return r && r.seq ? r.seq.slice() : []; }
function staffSVG(notes, cur){

    for (let k = 40; k <= d; k += 2) s += '<line x1="' + (x - 11) + '" x2="' + (x + 11) + '" y1="' + yOf(k) + '" y2="' + yOf(k) + '" stroke="var(--muted)" stroke-width="1"/>';

    if (SHARP[((o.midi % 12) + 12) % 12]) s += '<text x="' + (x - 16) + '" y="' + (y + 4) + '" font-size="12" fill="' + col + '">♯</text>';
    s += '<text x="' + x + '" y="' + (bot + 12) + '" text-anchor="middle" font-size="11" font-weight="600" font-family="IBM Plex Mono, ui-monospace, monospace" fill="' + col + '">' + nn(o.midi) + '</text>';
    if (o.btn){ const b = BTN[o.btn]; s += '<circle cx="' + x + '" cy="' + (bot + 30) + '" r="9" fill="' + (b.cls === 'a' ? 'var(--abtn)' : 'var(--cbtn)') + '"/><text x="' + x + '" y="' + (bot + 34) + '" text-anchor="middle" font-size="' + (b.cls === 'a' ? 10 : 8) + '" font-weight="700" fill="' + (b.cls === 'a' ? '#fff' : 'var(--cbtn-ink)') + '">' + b.glyph + '</text>'; }
    s += '<rect x="' + (x - gap / 2) + '" y="' + top + '" width="' + gap + '" height="' + H + '" fill="transparent" data-i="' + i + '" style="cursor:pointer"/>';
  });
  return s + '</svg>';
}
function renderSongView(){
  const p = $('#panel-songs'); p.replaceChildren();
  const sg = currentSong(); if (!sg){ ui.song.view = 'list'; return renderSongs(); }
  const notes = songNotes(sg);
  if (ui.song.step >= notes.length) ui.song.step = 0;
  const cur = notes[ui.song.step], f = cur ? fingeringFor(cur.midi) : null;
  const go = i => { ui.songDone = false; ui.song.step = Math.max(0, Math.min(notes.length - 1, i)); renderSongView(); refreshStage(); };
  const staff = el('div', {class:'staffbox', html: staffSVG(notes, ui.song.step)});
  staff.addEventListener('click', e => { const i = e.target.getAttribute && e.target.getAttribute('data-i'); if (i != null){ stopPlay(); go(+i); playNote(notes[+i].midi, 0.6); } });
  const tempo = el('select', {id:'tempo', 'aria-label':'Tempo', onchange: e => { ui.tempo = +e.target.value; }});
  [60, 75, 90, 110, 130].forEach(t => tempo.append(el('option', {value:String(t), selected: ui.tempo === t}, t + ' bpm')));
  function play(i){
    if (i >= notes.length){ ui.playing = null; renderSongView(); return; }
    ui.song.step = i; renderSongView(); refreshStage();
    const beat = 60 / ui.tempo;
    playNote(notes[i].midi, beat * 0.9);
    ui.playing = setTimeout(() => play(i + 1), beat * 1000);
  }
  const missing = [...new Set(notes.filter(o => !fingeringFor(o.midi)).map(o => o.midi))];
  p.append(
    el('div', {class:'row', style:'justify-content:space-between'},
      el('button', {type:'button', class:'btn ghost', onclick: () => { stopPlay(); ui.song.view = 'list'; renderSongs(); refreshStage(); }}, '‹ All songs'),
      el('button', {type:'button', class:'btn ghost', onclick: () => { stopPlay(); ui.song.view = 'edit'; ui.song.buf = songSeq(sg); ui.song.name = sg.name; ui.song.custom = !!sg.custom; renderSongs(); }}, sg.custom ? 'Edit song' : 'Edit buttons')
    ),
    el('h2', {}, sg.name),
    staff,
    cur ? el('div', {class:'now'},
      el('div', {class:'bignote'}, nn(cur.midi)),
      el('div', {}, cur.btn ? el('div', {class:'row', style:'gap:6px'}, glyph(cur.btn), el('span', {class:'sub'}, BTN[cur.btn].name)) : null,
        el('div', {class:'sub'}, f ? describe(f) : 'No fingering plays this note yet.'))
    ) : null,
    micPanel('song'),
    ui.songDone ? el('p', {class:'pill ok', style:'display:inline-block;margin:10px 0 0'}, 'Song complete. Press ‹ or tap the first note to go again.') : null,
    el('div', {class:'player'},
      el('button', {type:'button', class:'icon', 'aria-label':'Previous note', disabled: ui.song.step === 0, onclick: () => { stopPlay(); go(ui.song.step - 1); }}, '‹'),
      ui.playing ? el('button', {type:'button', class:'btn primary', onclick: () => { stopPlay(); renderSongView(); }}, '■ Stop')
                 : el('button', {type:'button', class:'btn primary', onclick: () => { stopPlay(); play(ui.song.step >= notes.length - 1 ? 0 : ui.song.step); }}, '▶ Play along'),
      el('button', {type:'button', class:'icon', 'aria-label':'Next note', disabled: ui.song.step >= notes.length - 1, onclick: () => { stopPlay(); go(ui.song.step + 1); playNote(notes[ui.song.step].midi, 0.6); }}, '›'),
      el('button', {type:'button', class:'btn', onclick: () => cur && playNote(cur.midi, 0.8)}, 'Hear note'),
      tempo
    ),
    missing.length ? el('p', {class:'hint', style:'color:var(--warn)'}, 'Missing fingerings for ' + missing.map(nn).join(', ') + '. Change the key shift in the song list or add the notes in Calibrate.') : el('p', {class:'hint'}, 'Tap any note on the staff to jump there. Every note gets one beat; follow the rhythm you know from the game.')
  );
}
function renderSongEdit(){
  const p = $('#panel-songs'); p.replaceChildren();
  const sg = currentSong(); const custom = sg ? !!sg.custom : !!ui.song.custom;
  const buf = ui.song.buf;
  const seq = el('div', {class:'seq', 'aria-live':'polite'});
  if (!buf.length) seq.append(el('span', {class:'ph'}, custom ? 'Tap notes below to add them' : 'Tap the buttons in order'));
  buf.forEach(x => seq.append(custom ? el('span', {class:'nchip'}, nn(x)) : glyph(x)));
  const add = x => { buf.push(x); playNote(custom ? x : BTN[x].midi + state.shift, 0.45); renderSongEdit(); };
  let input;
  if (custom){
    const notes = [...new Set(state.steps.filter(s => s.note != null).map(s => s.note))].sort((a, b) => a - b);
    input = el('div', {class:'notegrid', style:'margin:12px 0'}, ...notes.map(m => el('button', {type:'button', onclick: () => add(m)}, nn(m))));
  } else {
    const c = (b, col, row) => el('button', {type:'button', class:'padbtn c', style:'grid-column:' + col + ';grid-row:' + row, 'aria-label': BTN[b].name, onclick: () => add(b)}, BTN[b].glyph);
    input = el('div', {class:'pad'},
      el('button', {type:'button', class:'padbtn a', 'aria-label':'A', onclick: () => add('A')}, 'A'),
      el('div', {class:'cgrid'}, c('U', 2, 1), c('L', 1, 2), c('R', 3, 2), c('D', 2, 3))
    );
  }
  const nameInput = custom ? el('input', {type:'text', id:'songname', value: ui.song.name || '', placeholder:'Song name', 'aria-label':'Song name', oninput: e => { ui.song.name = e.target.value; }}) : null;
  const save = () => {
    if (!buf.length) return;
    if (custom){
      const name = (ui.song.name || '').trim() || 'My song';
      if (sg){ const c = state.custom.find(x => x.id === sg.id); c.name = name; c.notes = buf.slice(); }
      else { const id = 'u' + Date.now().toString(36); state.custom.push({id, name, notes: buf.slice()}); ui.song.id = id; }
    } else state.songs[sg.id] = {seq: buf.slice()};
    commit(); ui.song.view = 'song'; ui.song.step = 0; renderSongs(); refreshStage();
  };
  const removeLabel = custom ? 'Delete song' : 'Lock again';
  p.append(
    el('button', {type:'button', class:'btn ghost', onclick: () => { ui.song.view = sg && isUnlocked(sg) ? 'song' : 'list'; ui.confirm = null; renderSongs(); refreshStage(); }}, '‹ Back'),
    el('h2', {style:'margin-top:6px'}, sg ? sg.name : 'New song'),
    el('p', {class:'lede', style:'margin-top:6px'}, custom ? 'Build a tune from the notes your ocarina plays.' : 'Enter the buttons in the order the game showed them when you learned this song.'),
    nameInput, seq, input,
    el('div', {class:'row'},
      el('button', {type:'button', class:'btn primary', disabled: !buf.length, onclick: save}, sg && isUnlocked(sg) ? 'Save' : 'Unlock song'),
      el('button', {type:'button', class:'btn', disabled: !buf.length, onclick: () => { buf.pop(); renderSongEdit(); }}, '⌫ Undo'),
      el('button', {type:'button', class:'btn ghost', disabled: !buf.length, onclick: () => { buf.length = 0; renderSongEdit(); }}, 'Clear'),
      sg && isUnlocked(sg) ? el('button', {type:'button', class:'btn ghost danger', onclick: () => { ui.confirm = 'song'; renderSongEdit(); }}, removeLabel) : null
    ),
    ui.confirm === 'song' && sg ? el('div', {class:'confirmbox', style:'margin-top:10px'}, el('span', {}, custom ? 'Delete "' + sg.name + '"?' : 'Forget the buttons for ' + sg.name + '?'),
      el('button', {type:'button', class:'btn', onclick: () => { ui.confirm = null; renderSongEdit(); }}, 'Keep'),
      el('button', {type:'button', class:'btn primary', onclick: () => { if (custom) state.custom = state.custom.filter(x => x.id !== sg.id); else delete state.songs[sg.id]; ui.confirm = null; commit(); ui.song.view = 'list'; renderSongs(); refreshStage(); }}, removeLabel)) : null
  );
}

/* ---------- Holes ---------- */
function syncBanner(){
  const b = $('#banner');
  if (ui.placing){ const h = holeById(ui.placing); b.hidden = false; $('#bannerText').textContent = 'Tap the model where ' + (h ? h.label : 'the hole') + ' sits. Use Underside for thumb holes.'; }
  else b.hidden = true;
}
$('#bannerCancel').addEventListener('click', () => { ui.placing = null; syncBanner(); renderHoles(); });
function renderHoles(){
  const p = $('#panel-holes'); p.replaceChildren();
  p.append(el('p', {class:'lede'}, 'Start from the layout that matches your print, then move any hole that sits somewhere else on yours. Finger names follow the usual 12-hole grip.'));
  const seg = el('div', {class:'seg'},
    el('button', {type:'button', 'aria-pressed': String(state.preset === '12'), onclick: () => { if (state.preset !== '12'){ ui.confirm = 'preset-12'; renderHoles(); } }}, '12-hole'),
    el('button', {type:'button', 'aria-pressed': String(state.preset === '10'), onclick: () => { if (state.preset !== '10'){ ui.confirm = 'preset-10'; renderHoles(); } }}, '10-hole')
  );
  p.append(el('div', {class:'row', style:'justify-content:space-between;margin-bottom:10px'}, el('span', {class:'eyebrow'}, 'Starting layout'), seg));
  if (ui.confirm && ui.confirm.startsWith('preset-')){
    const k = ui.confirm.split('-')[1];
    p.append(el('div', {class:'confirmbox', style:'margin-bottom:10px'}, el('span', {}, 'Switch to the ' + k + '-hole layout? This resets your holes and calibration. Unlocked songs stay.'),
      el('button', {type:'button', class:'btn', onclick: () => { ui.confirm = null; renderHoles(); }}, 'Cancel'),
      el('button', {type:'button', class:'btn primary', onclick: () => { const f = preset(k); state.preset = k; state.holes = f.holes; state.steps = f.steps; ui.step = 0; ui.holeSel = null; ui.confirm = null; commit(); stageRebuild(); renderHoles(); }}, 'Switch')));
  }
  const list = el('div', {class:'holes'});
  for (const h of state.holes){
    const sizes = [['S',0.06],['M',0.09],['L',0.11]];
    const row = el('div', {class:'holerow', role:'option', tabindex:'0', 'aria-selected': String(ui.holeSel === h.id), onclick: () => { ui.holeSel = h.id; renderHoles(); refreshStage(); }, onkeydown: e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); ui.holeSel = h.id; renderHoles(); refreshStage(); } }},
      el('span', {class:'tag'}, h.label),
      el('span', {class:'fn'}, h.finger || 'Unassigned', el('small', {}, h.side === 'bottom' ? 'underside' : 'top')),
      el('div', {class:'seg', onclick: e => e.stopPropagation()}, ...sizes.map(([n, r]) => el('button', {type:'button', 'aria-label':'Size ' + n, 'aria-pressed': String(Math.abs(h.r - r) < 0.011 || (n === 'L' && h.r > 0.1) || (n === 'S' && h.r < 0.07)), onclick: () => { h.r = r; commit(); stageRebuild(); renderHoles(); }}, n))),
      el('button', {type:'button', class:'btn', style:'padding:5px 10px', onclick: e => { e.stopPropagation(); ui.holeSel = h.id; ui.placing = h.id; syncBanner(); renderHoles(); refreshStage(); }}, ui.placing === h.id ? 'Tap model…' : 'Move'),
      el('button', {type:'button', class:'btn ghost danger', style:'padding:5px 8px', 'aria-label':'Remove ' + h.label, onclick: e => { e.stopPropagation(); ui.confirm = 'hole-' + h.id; renderHoles(); }}, '✕')
    );
    list.append(row);
    if (ui.confirm === 'hole-' + h.id){
      list.append(el('div', {class:'confirmbox'}, el('span', {}, 'Remove ' + h.label + ' from the model and every fingering?'),
        el('button', {type:'button', class:'btn', onclick: () => { ui.confirm = null; renderHoles(); }}, 'Keep'),
        el('button', {type:'button', class:'btn primary', onclick: () => { state.holes = state.holes.filter(x => x.id !== h.id); state.steps.forEach(s => { s.closed = s.closed.filter(x => x !== h.id); }); if (ui.holeSel === h.id) ui.holeSel = null; ui.confirm = null; commit(); stageRebuild(); renderHoles(); }}, 'Remove')));
    }
  }
  p.append(list);
  // add a hole
  const nameIn = el('input', {type:'text', id:'newhole', placeholder:'Label, e.g. extra', 'aria-label':'New hole label', style:'flex:1;min-width:10ch'});
  p.append(el('h3', {}, 'Add a hole'), el('div', {class:'row'}, nameIn, el('button', {type:'button', class:'btn', onclick: () => {
    const label = nameIn.value.trim().slice(0, 8) || ('H' + (state.holes.length + 1));
    const id = 'h' + Date.now().toString(36);
    state.holes.push({id, label, finger:'Unassigned', x:0, z:0, side:'top', r:0.08});
    ui.holeSel = id; ui.placing = id; commit(); stageRebuild(); syncBanner(); renderHoles();
  }}, 'Add and place')));
  p.append(el('p', {class:'hint'}, 'New holes start open in every fingering. Cover them where needed in Calibrate.'));
  const file = el('input', {type:'file', id:'importfile', accept:'application/json,.json', hidden:true, onchange: e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { try { const d = JSON.parse(rd.result); if (!d || !Array.isArray(d.holes) || !Array.isArray(d.steps)) throw 0; state = normalize(d); commit(); clampUi(); ui.backupMsg = 'Backup loaded.'; stageRebuild(); renderHoles(); } catch(err){ ui.backupMsg = 'That file is not an Ocarina Coach backup.'; renderHoles(); } };
    rd.readAsText(f);
  }});
  p.append(el('h3', {}, 'Backup'),
    el('p', {class:'hint', style:'margin:0 0 8px'}, 'Your setup is saved in this browser only. Save a backup file to move it to another device or browser.'),
    el('div', {class:'row'},
      el('button', {type:'button', class:'btn', onclick: () => {
        const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
        const a = el('a', {href: URL.createObjectURL(blob), download: 'ocarina-coach-backup.json'});
        document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      }}, 'Save backup file'),
      el('button', {type:'button', class:'btn', onclick: () => file.click()}, 'Load backup'), file),
    ui.backupMsg ? el('p', {class:'hint'}, ui.backupMsg) : null);
}

/* ---------- boot ---------- */
setSync('local');
initStage();
stageRebuild();
setTab(TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'calibrate', true);
})();
</script>
